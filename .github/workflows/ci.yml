name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint, test and verify requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

      # The rqtk-client public API record is read from rustdoc JSON, which only nightly emits.
      # Pinned, so the JSON format matches the `public-api` crate's.
      - name: Nightly for the public API record
        run: rustup toolchain install nightly-2026-06-22 --profile minimal

      # The TypeScript client's tests run on Node (preinstalled), Bun and Deno.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6

      # rqtk tracks its own requirements: every file lints, the committed evidence matches
      # this test run, and every requirement is verified against its current wording.
      - name: Test and verify requirements
        run: scripts/verify-requirements.sh
        env:
          # feat/client is built in four stages; requirements of the later ones are Planned
          # until they land. Only this branch's pull request accepts that; master stays
          # strict, and the script fails once nothing is unfinished.
          RQTK_ALLOW_UNFINISHED: ${{ github.head_ref == 'feat/client' && '1' || '' }}
      # RQTK-CLIENT-0020's limits are for an optimised build on this runner.
      - name: Client performance (optimised)
        run: cargo test --release -p rqtk-client --test performance -- --nocapture
      - run: cargo test --workspace --exclude rqtk-py --doc
      - run: cargo check -p rqtk-py
      # `rqtk` as a test dependency: the macros without the CLI.
      - run: cargo check -p rqtk --lib --no-default-features --features macros
      - run: cargo check -p rqtk --lib --no-default-features --features requirements-docs

      - name: Schemas are up to date
        run: |
          cargo run -p rqtk-core --bin generate_schemas
          git diff --exit-code -- schema/

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --exclude rqtk-py --all-targets
