name: Publish to crates.io

# Called by the cargo-dist release workflow (see `publish-jobs` in dist-workspace.toml) after
# the binaries are uploaded, and runnable by hand to publish an existing tag.
on:
  workflow_call:
    inputs:
      plan:
        description: cargo-dist's release plan (unused; required by the publish-job interface)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6
        with:
          # From the release workflow, github.ref is already the tag.
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable

      # Skip crates whose version is already on crates.io, so a partly failed release can be
      # re-run. `cargo publish --workspace` publishes the rest in dependency order and skips
      # crates marked `publish = false` (rqtk-py).
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          excludes=()
          while read -r name version; do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -A "rqtk release (https://github.com/wdoppenberg/rqtk)" \
              "https://crates.io/api/v1/crates/$name/$version")
            if [ "$status" = 200 ]; then
              echo "$name $version is already on crates.io; skipping"
              excludes+=(--exclude "$name")
            fi
          done < <(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish != []) | "\(.name) \(.version)"')
          cargo publish --workspace --locked "${excludes[@]}"
