name: npm

# Builds `@rqtk/client` (crates/rqtk-node) prebuilt: one package per platform holding the
# addon, and the main package, which depends on them optionally so npm installs only the one
# that matches. Each platform's packages are installed and opened on that platform. Publishing
# them to npm is not set up yet.
#
# Linux addons are built in containers on runners of the same architecture: manylinux_2_28
# for glibc (so they load on glibc 2.28 and later, like the Python wheels) and Alpine for musl.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
    paths:
      - "crates/rqtk-node/**"
      - "crates/rqtk-client/**"
      - "crates/rqtk-core/**"
      - "Cargo.lock"
      - "scripts/smoke-client.mjs"
      - ".github/workflows/publish-npm.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  addon:
    name: addon (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64-gnu, os: ubuntu-latest, image: quay.io/pypa/manylinux_2_28_x86_64 }
          - { platform: linux-arm64-gnu, os: ubuntu-24.04-arm, image: quay.io/pypa/manylinux_2_28_aarch64 }
          - { platform: linux-x64-musl, os: ubuntu-latest, image: rust:1-alpine }
          - { platform: linux-arm64-musl, os: ubuntu-24.04-arm, image: rust:1-alpine }
          - { platform: darwin-arm64, os: macos-26 }
          - { platform: win32-x64-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@v6
      - name: Build in ${{ matrix.image }}
        if: matrix.image
        run: |
          docker run --rm -v "$PWD:/w" -w /w "${{ matrix.image }}" sh -euc '
            if command -v apk > /dev/null; then
              apk add --no-cache build-base cmake perl
              # A musl cdylib must link libc dynamically to load into Node.
              export RUSTFLAGS="-C target-feature=-crt-static"
            else
              curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
              . "$HOME/.cargo/env"
            fi
            cargo build --release --locked -p rqtk-node
            cp target/release/librqtk_node.so crates/rqtk-node/rqtk.${{ matrix.platform }}.node
          '
      - name: Build
        if: ${{ !matrix.image }}
        shell: bash
        run: |
          cargo build --release --locked -p rqtk-node
          case "${{ matrix.platform }}" in
            darwin-*) lib=target/release/librqtk_node.dylib ;;
            win32-*) lib=target/release/rqtk_node.dll ;;
          esac
          cp "$lib" "crates/rqtk-node/rqtk.${{ matrix.platform }}.node"
      - uses: actions/upload-artifact@v7
        with:
          name: addon-${{ matrix.platform }}
          path: crates/rqtk-node/rqtk.${{ matrix.platform }}.node
          if-no-files-found: error

  package:
    needs: addon
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/rqtk-node
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Package version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::@rqtk/client is $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi
      - run: npm ci --no-audit --no-fund
      # The loader (native.cjs) and its types come from a build; the addon it makes is unused.
      - name: Generate the loader
        run: |
          npx napi build --platform --js native.cjs --dts native.d.ts
          rm -f ./*.node
      - uses: actions/download-artifact@v8
        with:
          pattern: addon-*
          path: crates/rqtk-node/artifacts
          merge-multiple: true
      # `napi artifacts` fails unless every configured target has its addon.
      - name: Platform packages
        run: |
          npx napi create-npm-dirs
          npx napi artifacts --output-dir artifacts
          for dir in npm/*/; do cp LICENSE-MIT LICENSE-APACHE "$dir"; done
      - name: Main package depends on the platform packages
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json"));
            pkg.optionalDependencies = Object.fromEntries(
              fs.readdirSync("npm").map((p) => [`${pkg.name}-${p}`, pkg.version]));
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");'
      - name: Pack
        run: |
          mkdir -p dist
          for dir in npm/*/; do (cd "$dir" && npm pack --pack-destination ../../dist); done
          npm pack --pack-destination dist
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: crates/rqtk-node/dist

  # Install each platform's package the way users get it and open a repository.
  smoke:
    name: smoke (${{ matrix.platform }})
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64-gnu, os: ubuntu-latest, image: "node:22-bullseye-slim" }
          - { platform: linux-arm64-gnu, os: ubuntu-24.04-arm, image: "node:22-bullseye-slim" }
          - { platform: linux-x64-musl, os: ubuntu-latest, image: "node:22-alpine" }
          - { platform: linux-arm64-musl, os: ubuntu-24.04-arm, image: "node:22-alpine" }
          - { platform: darwin-arm64, os: macos-26 }
          - { platform: win32-x64-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: dist
      - name: Prepare
        shell: bash
        run: |
          mkdir smoke
          cp scripts/smoke-client.mjs smoke/
          cp dist/rqtk-client-[0-9]*.tgz "dist/rqtk-client-${{ matrix.platform }}-"[0-9]*.tgz smoke/
      - name: Install and open in ${{ matrix.image }}
        if: matrix.image
        run: |
          docker run --rm -v "$PWD:/w" -w /w/smoke "${{ matrix.image }}" sh -euc '
            npm init -y > /dev/null
            npm install --no-audit --no-fund ./*.tgz
            node smoke-client.mjs /w/crates/rqtk/tests/fixtures/firesat-obc
          '
      - uses: actions/setup-node@v6
        if: ${{ !matrix.image }}
        with:
          node-version: 24
      - name: Install and open
        if: ${{ !matrix.image }}
        shell: bash
        working-directory: smoke
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund ./*.tgz
          node smoke-client.mjs ../crates/rqtk/tests/fixtures/firesat-obc

