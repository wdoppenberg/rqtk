id = "RQTK-CLI-0001"
title = "JSON output"
category = "CLI"
type = "Functional"
state = "Approved"
priority = "Critical"
statement = "Every rqtk command that reports data shall print a single JSON document when given `--json` and only add fields within a major version."
rationale = "Agents and scripts parse the output; removing or retyping a field breaks them."

