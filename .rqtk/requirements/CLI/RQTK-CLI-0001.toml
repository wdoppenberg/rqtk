id = "RQTK-CLI-0001"
title = "JSON output"
category = "CLI"
type = "Functional"
state = "Approved"
priority = "Critical"
statement = "Every rqtk command that reports data shall print a single JSON document when given `--json`, serialising the client's types with a `schema` field naming its version, and shall only add fields within a major version."
rationale = "Agents and scripts parse the output; removing or retyping a field breaks them. Serialising the client's types makes the CLI and the client libraries report the same thing, and the `schema` field tells a reader which version of the shape it has. rqtk 2.0 changes the shapes once, to the client's types."

