id = "RQTK-CLI-0012"
title = "Direct dependencies only"
category = "CLI"
type = "Functional"
state = "Draft"
priority = "Medium"
statement = "rqtk interfaces sync shall vendor only the aliases declared by the consumer and ignore the provider's own vendored interfaces."
rationale = "Keeps the dependency graph explicit; a consumer that needs a transitive interface declares it."

