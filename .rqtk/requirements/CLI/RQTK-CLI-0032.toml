parents = ["RQTK-SYS-0003"]

[verification]
method = "Test"
level = "Integration"
phase = "Development"
success_criteria = "After installing over a repository with the old skill names, their links and unedited files are gone, an edited file is kept and reported as kept, and --force removes it too."

