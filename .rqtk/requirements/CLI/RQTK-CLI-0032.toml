id = "RQTK-CLI-0032"
title = "Renamed skills retired"
category = "CLI"
type = "Functional"
state = "Draft"
priority = "Medium"
statement = "When rqtk skills install runs, rqtk shall remove each skill an earlier rqtk installed under a name it no longer ships, keeping every file of it that was edited locally unless --force is given."
rationale = "The user-invoked skills were renamed to the rqtk- prefix; without retiring the old directories, an upgraded repository would offer each of them twice under two names."

