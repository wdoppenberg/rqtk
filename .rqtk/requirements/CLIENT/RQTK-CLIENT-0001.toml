id = "RQTK-CLIENT-0001"
title = "Stable client surface"
category = "CLIENT"
type = "Constraint"
state = "Draft"
priority = "High"
statement = "The rqtk-client crate shall be the only public client API, and changes to its public items shall follow semantic versioning."
rationale = "rqtk-core's internals must stay free to change; a curated facade is what companies build on, so its changes have to be deliberate and versioned."

