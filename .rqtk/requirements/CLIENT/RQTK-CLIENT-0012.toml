statement = "The client shall provide the context, trace, coverage, lint, impact, diff, baseline and history views, each equal to the `--json` output of the matching CLI command."
rationale = "The CLI and the client must never disagree about a repository; making `--json` the serialisation of the client's types makes that checkable."

