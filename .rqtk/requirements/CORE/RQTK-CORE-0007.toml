id = "RQTK-CORE-0007"
title = "Interface declaration"
category = "CORE"
type = "Functional"
state = "Draft"
priority = "High"
statement = "rqtk shall treat a requirement as an interface if and only if it contains an `[interface]` table listing spec entries, each with a format, a repository-relative path or glob, and an optional element pointer."
rationale = "Type names are configurable per project, so the marker must be structural; one spec file is usually shared by many requirements, each pointing at one element."

