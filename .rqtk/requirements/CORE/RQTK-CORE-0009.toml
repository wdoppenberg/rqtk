id = "RQTK-CORE-0009"
title = "Spec file lint"
category = "CORE"
type = "Functional"
state = "Draft"
priority = "Medium"
statement = "rqtk lint shall report an error when an interface spec path or glob matches no file or its format is not one of openapi, protobuf, asyncapi, jsonschema or other."
rationale = "A contract pointing at a missing file or an unknown format cannot be hashed or consumed reliably."

