id = "RQTK-CORE-0011"
title = "Unresolved consumes links"
category = "CORE"
type = "Functional"
state = "Draft"
priority = "High"
statement = "rqtk lint shall report an error when a `consumes` link names an alias that is not declared or a requirement that is absent from that alias's vendored snapshot."
rationale = "A requirement removed upstream breaks every consumer that depends on it; this must surface at lint time."

