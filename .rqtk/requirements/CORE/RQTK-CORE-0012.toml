id = "RQTK-CORE-0012"
title = "Consumer suspect on upstream change"
category = "CORE"
type = "Functional"
state = "Draft"
priority = "High"
statement = "rqtk shall mark a requirement Suspect when the content hash of an interface requirement that it or one of its ancestors consumes has changed since the requirement's evidence was recorded or it was last reviewed."
rationale = "Reuses the existing review-debt mechanism so a provider's contract change is reviewed by every consumer before it is accepted."

