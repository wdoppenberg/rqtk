id = "RQTK-CORE-0013"
title = "Vendor integrity"
category = "CORE"
type = "Functional"
state = "Draft"
priority = "High"
statement = "rqtk lint shall report an error when the files in `.rqtk/vendor/` do not match the file list and hashes recorded in `.rqtk/interfaces.lock`."
rationale = "Vendored content is a copy of the provider's contract; hand edits would silently fork it."

