id = "RQTK-CORE-0016"
title = "Provider-independent validation"
category = "CORE"
type = "Constraint"
state = "Draft"
priority = "Medium"
statement = "rqtk shall validate vendored requirements against its built-in schema for the provider's schema version and never against the consumer's configuration."
rationale = "Each provider has its own ID pattern, types and custom fields; the consumer's policy does not apply to someone else's requirements."

