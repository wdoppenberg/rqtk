id = "RQTK-CORE-0018"
title = "Symlinks in provider content"
category = "CORE"
type = "Constraint"
state = "Draft"
priority = "Critical"
statement = "rqtk interfaces sync shall abort without writing any file when a provider file it would vendor is a symbolic link."
rationale = "A provider may be an untrusted party; a symlink in its content could make the consumer read or overwrite files outside the vendor directory."

[trace]
parents = ["RQTK-SYS-0006"]
satisfies = ["NEED-0005"]

[verification]
method = "Test"
level = "Unit"
phase = "Development"
success_criteria = "A symlinked spec or requirement file in the provider aborts sync and leaves .rqtk/vendor/ and the lockfile unchanged."

[[verification.activities]]
id = "VA-CORE-0018-01"
name = "Symlinks in provider content are rejected"

