id = "RQTK-CORE-0021"
title = "Vendored content is never executed"
category = "CORE"
type = "Constraint"
state = "Draft"
priority = "Critical"
statement = "rqtk shall not execute, load as code, or pass to a shell any vendored file or field."
rationale = "A provider may be an untrusted party; vendoring its interface must not give it code execution in the consumer's environment."

