id = "RQTK-CORE-0024"
title = "OpenAPI reference closure"
category = "CORE"
type = "Functional"
state = "Draft"
priority = "High"
statement = "For an openapi spec entry, rqtk shall resolve every `$ref` to a fragment or to a relative file, transitively, and treat each referenced file as part of the spec."
rationale = "A contract split across files must be vendored whole, or the consumer receives an incomplete interface."

