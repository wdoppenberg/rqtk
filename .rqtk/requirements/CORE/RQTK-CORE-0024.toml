parents = ["RQTK-SYS-0006"]
satisfies = ["NEED-0004"]

[verification]
method = "Test"
level = "Unit"
phase = "Development"
success_criteria = "A document referencing schemas in two other files, one of them recursively, yields all three files; reference cycles terminate."

