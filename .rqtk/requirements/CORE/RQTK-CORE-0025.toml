id = "RQTK-CORE-0025"
title = "No remote or escaping OpenAPI references"
category = "CORE"
type = "Constraint"
state = "Draft"
priority = "Critical"
statement = "rqtk shall report an error for a spec path or an OpenAPI `$ref` that is an absolute URL or points outside the repository, and shall never read or fetch it."
rationale = "A provider may be an untrusted party; following its references must not make the consumer fetch URLs or read files outside the provider's content."

[trace]
parents = ["RQTK-SYS-0006"]
satisfies = ["NEED-0005"]

[verification]
method = "Test"
level = "Unit"
phase = "Development"
success_criteria = "An https: ref, a file: ref and a ../ ref escaping the repository each produce an error, as do an absolute spec path and one climbing out with ../, and no network request or out-of-tree read happens."

[[verification.activities]]
id = "VA-CORE-0025-01"
name = "Absolute URL refs are rejected unfetched"

[[verification.activities]]
id = "VA-CORE-0025-02"
name = "Escaping relative refs are rejected"

[[verification.activities]]
id = "VA-CORE-0025-03"
name = "An escaping spec path is an error"
