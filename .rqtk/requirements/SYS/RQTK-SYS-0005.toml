id = "RQTK-SYS-0005"
title = "Review debt"
category = "SYS"
type = "Functional"
state = "Approved"
priority = "Critical"
statement = "rqtk shall keep a requirement Suspect after it or anything it derives from changes, until tests changed for it pass or a review is recorded."
rationale = "Rerunning unchanged tests, or tests of a child whose parent changed, proves nothing about the new wording; without this, contradictions go green."

