[package]
name = "rqtk-core"
version = "0.1.0"
edition = "2024"

[features]
verification-lookup = []

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
petgraph = "0.8.3"
regex = "1.12.2"
schemars = { version = "1.0.4", features = ["chrono04"] }
semver = { version = "1.0.27", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
toml = "0.9.8"

[dev-dependencies]
tempfile = "3"
trybuild = "1"
rqtk-macros = { path = "../rqtk-macros" }
