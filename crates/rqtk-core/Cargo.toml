[package]
name = "rqtk-core"
version = "0.1.0"
description = "Core library of rqtk: requirement model, loading and lint rules, verification evidence, and git integration."
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
keywords = ["requirements", "traceability", "verification"]
categories = ["development-tools"]

[features]
verification-lookup = []

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
gix = "0.83.0"
ignore = "0.4"
petgraph = "0.8.3"
quick-xml = "0.41"
regex = "1.12.2"
schemars = { version = "1.0.4", features = ["chrono04"] }
semver = { version = "1.0.27", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10"
thiserror = "2.0.17"
toml = { workspace = true }
toml_edit = "0.25"

[dev-dependencies]
gix = "0.83.0"
tempfile = "3"
trybuild = "1"
# Path only: unversioned dev-dependencies are dropped on publish, avoiding a cycle.
rqtk-macros = { path = "../rqtk-macros" }
