[package]
name = "rqtk-macros"
version = "0.1.0"
description = "The #[verifies] attribute: link Rust tests to rqtk verification activities, checked at compile time."
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
keywords = ["requirements", "traceability", "testing"]
categories = ["development-tools::testing"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
rqtk-core = { workspace = true, features = ["verification-lookup"] }
syn = { version = "2", features = ["full"] }

[dev-dependencies]
trybuild = "1"
