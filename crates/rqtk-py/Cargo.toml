[package]
name = "rqtk-py"
# Released to PyPI as `rqtk`, in step with the rqtk command line.
version = "1.2.0"
description = "The rqtk Python package: the rqtk command line and the @verifies decorator."
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
keywords = ["requirements", "traceability", "python"]
categories = ["development-tools::testing"]
publish = false

[dependencies]
# abi3: one wheel per platform for every Python from 3.9 on.
pyo3 = { version = "0.28.3", features = ["extension-module", "abi3-py39"] }
rqtk = { path = "../rqtk", default-features = false, features = ["cli"] }
rqtk-core = { workspace = true, features = ["verification-lookup"] }

[build-dependencies]
pyo3-build-config = "0.28.3"

[lib]
# Not `rqtk`: that name would collide with the rqtk binary's outputs (rqtk.exe, rqtk.pdb) on
# Windows. Python imports it as `rqtk._rqtk` (see pyproject.toml).
name = "_rqtk"
crate-type = ["cdylib"]
