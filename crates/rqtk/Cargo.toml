[package]
name = "rqtk"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.42"
clap = { version = "4.5.53", features = ["derive"] }
rqtk-cpp = { path = "../rqtk-cpp" }
rqtk-core = { path = "../rqtk-core" }
semver = "1.0.27"
serde_json = "1.0.145"
toml = { workspace = true }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.0"
rqtk-macros = { path = "../rqtk-macros" }
