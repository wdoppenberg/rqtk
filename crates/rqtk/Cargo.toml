[package]
name = "rqtk"
version = "0.1.0"
edition = "2024"

[dependencies]
rqtk-core = { path = "../rqtk-core" }
rqtk-export = { path = "../rqtk-export", features = ["clap"] }
rqtk-macros = { path = "../rqtk-macros", optional = true }
rqtk-report = { path = "../rqtk-report" }
serde = { workspace = true }
serde_json = "1.0.145"
clap = { version = "4.5.53", features = ["derive"], optional = true }
semver = "1.0.27"
console = "0.16"
comfy-table = "7.2"
chrono = "0.4.44"

[features]
default = ["cli"]
macros = ["dep:rqtk-macros"]
cli = ["dep:clap"]

[[bin]]
name = "rqtk"
path = "src/main.rs"
required-features = ["cli"]

[dev-dependencies]
assert_cmd = "2.0"
gix = "0.83.0"
predicates = "3.0"
tempfile = "3.0"
rqtk-macros = { path = "../rqtk-macros" }
