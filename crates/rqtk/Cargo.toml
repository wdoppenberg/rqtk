[package]
name = "rqtk"
version = "1.0.0"
description = "Requirements that live in your repository: TOML requirements, git baselines, test-backed verification, and skills for coding agents."
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
keywords = ["requirements", "traceability", "verification", "systems-engineering", "cli"]
categories = ["command-line-utilities", "development-tools", "development-tools::testing"]
readme = "../../README.md"

[dependencies]
rqtk-core = { workspace = true }
rqtk-export = { workspace = true }
rqtk-macros = { workspace = true, optional = true }
rqtk-report = { workspace = true }
serde = { workspace = true }
serde_json = "1.0.145"
toml = { workspace = true }
clap = { version = "4.5.53", features = ["derive"], optional = true }
regex = "1.12"
semver = "1.0.27"
sha2 = "0.10"
console = "0.16"
comfy-table = "7.2"
chrono = "0.4.44"

[features]
default = ["cli"]
# The command-line tool (the `rqtk` binary).
cli = ["dep:clap", "rqtk-export/clap"]
# `rqtk::verifies` and `rqtk::requirements_docs`: link Rust tests and docs to requirements.
macros = ["dep:rqtk-macros"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "rqtk"
path = "src/main.rs"
required-features = ["cli"]

[dev-dependencies]
assert_cmd = "2.0"
gix = "0.83.0"
predicates = "3.0"
tempfile = "3.0"
# Path only: unversioned dev-dependencies are dropped on publish, avoiding a cycle.
rqtk-macros = { path = "../rqtk-macros" }
