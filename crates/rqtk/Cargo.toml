[package]
name = "rqtk"
version = "1.1.0"
description = "Requirements that live in your repository: TOML requirements, git baselines, test-backed verification, and skills for coding agents."
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
keywords = ["requirements", "traceability", "verification", "systems-engineering", "cli"]
categories = ["command-line-utilities", "development-tools", "development-tools::testing"]
readme = "../../README.md"

[dependencies]
rqtk-core = { workspace = true, optional = true }
rqtk-export = { workspace = true, optional = true }
rqtk-macros = { workspace = true, optional = true }
rqtk-report = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { version = "1.0.145", optional = true }
toml = { workspace = true, optional = true }
clap = { version = "4.5.53", features = ["derive"], optional = true }
regex = { version = "1.12", optional = true }
semver = { version = "1.0.27", optional = true }
sha2 = { version = "0.10", optional = true }
console = { version = "0.16", optional = true }
comfy-table = { version = "7.2", optional = true }
chrono = { version = "0.4.44", optional = true }

[features]
default = ["cli"]
# The command-line tool (the `rqtk` binary).
cli = [
    "lib",
    "dep:clap",
    "rqtk-export/clap",
    "dep:rqtk-report",
    "dep:serde",
    "dep:serde_json",
    "dep:toml",
    "dep:regex",
    "dep:semver",
    "dep:sha2",
    "dep:console",
    "dep:comfy-table",
    "dep:chrono",
]
# `rqtk::core` and `rqtk::export`: the library crates the tool is built from.
lib = ["dep:rqtk-core", "dep:rqtk-export"]
# `rqtk::verifies`: link Rust tests to verification activities. Light: no git, no CLI.
macros = ["dep:rqtk-macros"]
# `rqtk::requirements_docs`: a rustdoc page of the requirements (builds all of rqtk-core).
requirements-docs = ["macros", "rqtk-macros/docs"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "rqtk"
path = "src/main.rs"
required-features = ["cli"]

[dev-dependencies]
assert_cmd = "2.0"
gix = "0.83.0"
predicates = "3.0"
tempfile = "3.0"
# Path only: unversioned dev-dependencies are dropped on publish, avoiding a cycle.
rqtk-macros = { path = "../rqtk-macros" }
