[requirement]
id = "FOBC-ICD-0001"
title = "Payload Subsystem MIL-STD-1553B Interface"
category = "ICD"
type = "Interface"

[requirement.statement]
text = "The OBC software shall communicate with the payload subsystem via MIL-STD-1553B data bus operating at 1 Mbps."
rationale = "MIL-STD-1553B is a radiation-tolerant, deterministic bus standard widely used in spacecraft; its bus controller architecture ensures the OBC maintains full command authority over the payload."
assumptions = [
  "The payload subsystem acts as a Remote Terminal on the 1553 bus.",
  "The OBC acts as Bus Controller for all payload communications.",
  "Dual redundant 1553 bus cabling is implemented per the spacecraft harness design.",
]

[requirement.status]
state = "Review"
priority = "High"
criticality = "Mission-Critical"

[requirement.traceability]
parents = ["FOBC-SW-0001"]
external = [
  { type = "references", ref = "MIL-STD-1553B" },
  { type = "derives-from", ref = "FireSat-ICD-REV-B §4.3" },
]

[requirement.allocation]
subsystems = ["OBC", "Payload"]
software_modules = ["bus_controller_driver"]
components = ["1553-bus-controller-asic"]

[requirement.verification]
method = "Test"
level = "Integration"
phase = "Development"
owner = "Interface Verification Lead"
# success_criteria intentionally omitted — acceptance criteria under review (coverage gap)

[[requirement.verification.activities]]
id = "VA-ICD-001-01"
name = "MIL-STD-1553B loopback connectivity test"
procedure = "Configure OBC as Bus Controller and payload simulator as Remote Terminal; transmit 1000 command/response message pairs and verify round-trip integrity."
expected_result = "All 1000 message pairs complete without error; measured bus utilisation below 50%."
status = "Planned"

[requirement.tags]
keywords = ["interface", "1553", "payload", "bus"]
labels = ["pending-acceptance-criteria"]
