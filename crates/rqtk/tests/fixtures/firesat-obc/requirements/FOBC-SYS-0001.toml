[requirement]
id = "FOBC-SYS-0001"
title = "Telemetry Data Acquisition"
category = "SYS"
type = "Functional"

keywords = [
    "telemetry",
    "data-acquisition",
    "health-monitoring",
    "pdr-approved",
]

[requirement.statement]
text = "The OBC software shall acquire telemetry data from all spacecraft subsystems at a minimum rate of 1 Hz."
rationale = "Continuous 1 Hz telemetry ensures ground operators have timely visibility into spacecraft health and enables rapid anomaly detection before conditions become mission-threatening."
assumptions = [
  "All subsystems expose a standardised telemetry interface as defined in the FireSat ICD.",
  "The onboard bus bandwidth is sufficient to sustain 1 Hz polling across all subsystems simultaneously.",
]

[requirement.status]
state = "Approved"
priority = "Critical"
criticality = "Mission-Critical"

[requirement.traceability]

[requirement.verification]
method = "Test"
level = "System"
phase = "Pre-launch"
owner = "Systems Verification Lead"
success_criteria = "All subsystem telemetry channels deliver frames to the OBC at ≥1 Hz with no frame loss over a 10-minute test window."

[[requirement.verification.activities]]
id = "VA-SYS-001-01"
name = "End-to-end telemetry acquisition test"
procedure = "Activate all subsystem simulators on the 1553 bus and record OBC telemetry frame timestamps for 10 minutes."
expected_result = "Frame arrival rate ≥1 Hz on every channel; zero dropped frames."
status = "Passed"
