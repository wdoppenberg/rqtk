[repository]
requirements_dir = "requirements"
required_files = []
required_dirs = []

[project]
name = "FireSat On-Board Computer Software"
short_name = "FireSat OBC"
description = "Software requirements for the FireSat mission on-board computer"
version = "1.0.0"
mission_phase = "Phase-B"
classification = "Unclassified"

[project.organization]
program = "FireSat"
center = "Goddard Space Flight Center"
responsible_engineer = "Jane Smith"
cognizant_authority = "Systems Engineering Manager"

[identification]
id_pattern = "^FOBC-(SYS|SW|HW|ICD)-\\d{4}$"
id_separator = "-"
prefix = "FOBC"
zero_padding = 4

[categories.SYS]
name = "System"
level = 1
description = "Top-level system requirements derived from mission objectives"
is_root = true

[categories.SW]
name = "Software"
level = 2
description = "On-board computer software requirements"

[categories.HW]
name = "Hardware"
level = 2
description = "On-board computer hardware requirements"

[categories.ICD]
name = "Interface Control"
level = 3
description = "Interface control document requirements"

[types]
allowed = ["Functional", "Performance", "Interface", "Constraint", "Design"]

[verification]
methods = ["Test", "Analysis", "Inspection", "Demonstration"]
levels = ["Unit", "Integration", "System", "Acceptance"]
phases = ["Development", "Pre-launch", "On-orbit"]

# Enforce NASA Appendix D method-per-type alignment for this programme.
[verification.method_constraints]
Design      = ["Analysis", "Inspection"]
Functional  = ["Test", "Demonstration", "Analysis"]
Performance = ["Test", "Analysis"]
Interface   = ["Test", "Inspection"]
Constraint  = ["Analysis", "Inspection"]

[lifecycle]
states = ["Draft", "Review", "Approved", "Implemented", "Verified", "Deprecated"]
default_state = "Draft"

[priority]
levels = ["Critical", "High", "Medium", "Low"]

[criticality]
levels = ["Safety-Critical", "Mission-Critical", "Non-Critical"]

[traceability]
# Superseded requirements must exist and be Deprecated before a replacement
# can reference them — critical for NASA configuration-management audits.
validate_supersedes = true

# All non-root requirements on this programme must cite their originating
# standard or stakeholder document in derived_from.
validate_derived_from = true

[[standards]]
id = "NASA-STD-8739.8"
title = "NASA Software Assurance and Software Safety Standard"
revision = "A"

[[standards]]
id = "MIL-STD-1553B"
title = "Digital Time Division Command/Response Multiplex Data Bus"

[change_control]
ccb_required_after = "Approved"
require_signoff = true
approvers = ["Systems Engineer", "Project Manager", "Safety Engineer"]

[validation]
require_rationale = true
require_verification_method = true

# SYS-level requirements on this programme must state their assumptions
# explicitly — required by the mission ConOps review board.
require_assumptions_for_levels = ["SYS"]

require_parent_for_levels = ["SW", "HW", "ICD"]
forbid_orphans = true
forbid_circular_traces = true
allow_tbd = false

# TBRs are permitted on this programme during Phase-B; they must be resolved
# before the System Requirements Review (SRR).
allow_tbr = true
tbr_required_fields = ["id", "value_estimate", "owner", "closeout_date"]

shall_keywords = ["shall"]

# Enforce NASA Appendix C banned-word policy on all requirement statements.
forbidden_keywords = [
  "flexible", "easy", "easily", "sufficient", "robust", "safe",
  "adequate", "user-friendly", "appropriate", "fast", "quickly",
  "portable", "lightweight", "maximize", "minimize",
]

[export]
formats = ["json", "csv", "markdown"]
default_output_dir = "exports"
