openapi: 3.0.3
info: {title: Users, version: "1.0.0"}
paths:
  /users/{id}:
    get:
      operationId: getUser
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema: {$ref: "schemas/user.yaml#/User"}
        "404": {description: No such user}
  /health:
    get:
      responses:
        "200": {description: The service is up}
