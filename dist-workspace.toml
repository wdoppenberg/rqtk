[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Build only the released package (-p rqtk). A whole-workspace build also builds rqtk-py,
# whose library is named `rqtk` too; on Windows its rqtk.dll/rqtk.pdb collide with the
# CLI's rqtk.exe/rqtk.pdb and break the build.
precise-builds = true
# Whether to install an updater program
install-updater = false
# Publish the crates to crates.io after the binaries are uploaded
publish-jobs = ["./publish-crates"]
# release.yml carries hand-added job permissions (host, announce); keep dist from reverting them
allow-dirty = ["ci"]
