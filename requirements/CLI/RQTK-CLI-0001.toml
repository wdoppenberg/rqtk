change = "Renamed title from 'Scaffold Add Requirement' to 'Add Requirement'; fixed participial phrase 'applying project-config defaults' to a full predicate; confirmed command and module names as 'add' and 'cli::add'."

[requirement.tags]
keywords = ["add", "scaffold", "auto-increment"]
labels = ["bootstrap"]
