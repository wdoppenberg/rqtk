[requirement.statement]
text = "The rqtk trace command shall, given a requirement ID, print the full upward path (ancestors) and downward path (descendants) of that requirement within the traceability graph."
rationale = "Engineers need to answer two questions: 'what stakeholder need justifies this requirement?' (upward) and 'what lower-level requirements implement this?' (downward); a single command that shows both eliminates manual graph traversal."
assumptions = []

