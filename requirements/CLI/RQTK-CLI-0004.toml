[requirement]
id = "RQTK-CLI-0004"
title = "Coverage Gap Detection"
category = "CLI"
type = "Functional"
content_hash = "66bcf7cf769ef4c523adf5d5a88599a8bb7868c7105f4372bce9d5fc9c6117fe"
parameters = []

[requirement.statement]
text = "The rqtk coverage command shall identify and report all requirements that either have an empty success_criteria field or have zero verification activities defined."
rationale = "Verification coverage is a contractual obligation on most engineering programmes; an automated gap report prevents unverified requirements from reaching design reviews undetected."
assumptions = []

