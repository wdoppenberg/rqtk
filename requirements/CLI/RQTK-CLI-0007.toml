[requirement]
id = "RQTK-CLI-0007"
title = "Baseline Version Validation"
category = "CLI"
type = "Functional"
content_hash = "b4f2fe32ba9b3817769f42a78e6531168dbee938b250563195222b28a8a375b1"
parameters = []

[requirement.statement]
text = "The rqtk baseline command shall exit non-zero without modifying any project files when the provided version string does not conform to the Semantic Versioning 2.0.0 specification."
rationale = "Baselines are formal configuration-management milestones; rejecting non-semver strings prevents freeform version labels that break sorting and automated version comparisons from entering the project record."
assumptions = []

