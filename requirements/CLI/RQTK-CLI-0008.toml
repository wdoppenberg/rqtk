[requirement]
id = "RQTK-CLI-0008"
title = "Version Diff"
category = "CLI"
type = "Functional"
version = "0.1.1"
created = "2026-05-06T00:00:00+00:00"
updated = "2026-05-07T00:00:00+00:00"

[requirement.statement]
text = "The rqtk diff command shall, given two semver version strings previously recorded by rqtk baseline, report all requirements whose history array contains an entry for one version but not the other, indicating additions and removals between those baselines."
rationale = "Change-control boards need a concise delta between baselines to assess scope; a diff command removes the need to manually compare two snapshots of a large requirement set."

[requirement.status]
state = "Approved"
priority = "Medium"
criticality = "Non-Critical"

[requirement.traceability]
parents = ["RQTK-SYS-0001"]

[requirement.allocation]
software_modules = ["cli::diff"]

[requirement.verification]
method = "Test"
level = "Integration"
phase = "Development"
owner = "Project Lead"
success_criteria = "Given a fixture where requirement R has a history entry for version 1.0.0 but not 0.9.0, rqtk diff 0.9.0 1.0.0 lists R under additions and lists no removals; given a requirement present in 0.9.0 history but absent in 1.0.0 history, that requirement appears under removals."

[[requirement.verification.activities]]
id = "VA-CLI-008-01"
name = "Diff addition detection test"
procedure = "Construct a fixture with requirement R having a history entry for version '1.0.0' only; run rqtk diff 0.9.0 1.0.0; assert R appears in the additions section and the removals section is empty."
expected_result = "R listed under additions; removals section empty."
status = "Planned"

[[requirement.verification.activities]]
id = "VA-CLI-008-02"
name = "Diff removal detection test"
procedure = "Construct a fixture with requirement S having a history entry for version '0.9.0' only; run rqtk diff 0.9.0 1.0.0; assert S appears in the removals section and the additions section is empty."
expected_result = "S listed under removals; additions section empty."
status = "Planned"

[[requirement.history]]
version = "0.1.0"
date = "2026-05-06"
author = "Wouter Doppenberg"
change = "Initial draft."

[[requirement.history]]
version = "0.1.1"
date = "2026-05-07"
author = "Wouter Doppenberg"
change = "Defined 'version labels' as 'semver version strings previously recorded by rqtk baseline'. Strengthened success criteria to cover both addition and removal detection with specific expected outputs. Added VA-CLI-008-02 for removal case."

[requirement.tags]
keywords = ["diff", "baseline", "change-control", "delta"]
labels = ["bootstrap"]
