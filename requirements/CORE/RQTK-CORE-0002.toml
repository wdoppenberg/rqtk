[requirement]
id = "RQTK-CORE-0002"
title = "Graph Cycle Detection"
category = "CORE"
type = "Functional"
version = "0.1.1"
created = "2026-05-06T00:00:00+00:00"
updated = "2026-05-07T00:00:00+00:00"

[requirement.statement]
text = "rqtk-core shall emit a lint issue with code RQ017 for each cycle detected in the parent–child traceability graph."
rationale = "A cyclic dependency between requirements is logically incoherent (A derives from B which derives from A) and would cause infinite loops in any traversal that assumes a DAG; early detection prevents downstream tool failures."

[requirement.status]
state = "Approved"
priority = "Critical"
criticality = "Non-Critical"

[requirement.traceability]
parents = ["RQTK-SYS-0007"]

[requirement.allocation]
software_modules = ["rqtk_core::repository", "rqtk_core::validation"]

[requirement.verification]
method = "Test"
level = "Unit"
phase = "Development"
owner = "Project Lead"
success_criteria = "Unit test constructs a two-node cycle in a RequirementSet, calls validate(), and asserts a LintIssue with code RQ017 is returned."

[[requirement.verification.activities]]
id = "VA-CORE-002-01"
name = "Cycle detection unit test"
procedure = "Create two requirements A and B where A.parents=[B] and B.parents=[A]; call validate(); assert RQ017 issue present."
expected_result = "LintIssue { code: RQ017, severity: Error } returned."
status = "Planned"

