[requirement]
id = "RQTK-SYS-0002"
title = "TOML-Based File Storage"
category = "SYS"
type = "Design"
version = "0.1.0"
created = "2026-05-06T00:00:00+00:00"
updated = "2026-05-06T00:00:00+00:00"

[requirement.statement]
text = "rqtk shall store each requirement as a standalone TOML file that is human-readable, diff-friendly, and manageable under standard version-control systems."
rationale = "One-file-per-requirement makes merge conflicts local to individual requirements; TOML is readable without tooling and has stable semantics that survive editor reformatting."
assumptions = [
  "Users have access to a POSIX filesystem.",
  "A version-control system (e.g., git) is used alongside rqtk.",
]

[requirement.status]
state = "Approved"
priority = "Critical"
criticality = "Mission-Critical"

[requirement.traceability]

[requirement.verification]
method = "Inspection"
level = "System"
phase = "Release"
owner = "Project Lead"
success_criteria = "Each requirement file contains exactly one [requirement] TOML table; files parse with the standard TOML parser without preprocessing; two independent engineers can resolve a conflicting edit without rqtk tooling."

[[requirement.verification.activities]]
id = "VA-SYS-002-01"
name = "File format inspection"
procedure = "Open any requirement TOML file in a plain text editor and verify it contains valid TOML that maps to the RequirementBody schema without any binary or encoded blobs."
expected_result = "File is valid TOML, human-readable, and schema-conformant."
status = "Planned"

[[requirement.history]]
version = "0.1.0"
date = "2026-05-06"
author = "Wouter Doppenberg"
change = "Initial draft."

[requirement.tags]
keywords = ["storage", "toml", "version-control"]
labels = ["bootstrap"]
