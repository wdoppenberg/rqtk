[requirement]
id = "RQTK-SYS-0002"
title = "TOML-Based File Storage"
category = "SYS"
type = "Design"
content_hash = "df906ed46684a632c5246b758fcf77b3d8e46db05ccc09078f393d4b829d729e"
parameters = []

[requirement.statement]
text = "rqtk shall store each requirement as a single standalone TOML file conforming to the TOML 1.0 specification."
rationale = "One-file-per-requirement isolates merge conflicts to individual requirements; TOML 1.0 has stable semantics that survive editor reformatting and are parseable without preprocessing."
assumptions = [
    "Users have access to a POSIX filesystem.",
    "A version-control system (e.g., git) is used alongside rqtk.",
]

