[requirement]
id = "RQTK-SYS-0003"
title = "Requirement Traceability Graph"
category = "SYS"
type = "Functional"
version = "0.1.1"
created = "2026-05-06T00:00:00+00:00"
updated = "2026-05-07T00:00:00+00:00"

[requirement.statement]
text = "rqtk shall maintain a directed acyclic graph of parent–child relationships between requirements."
rationale = "A formal graph model is the prerequisite for automated traceability traversal, coverage analysis, and graph export; without it, requirement relationships exist only as informal annotations."

[requirement.status]
state = "Approved"
priority = "Critical"
criticality = "Mission-Critical"

[requirement.traceability]

[requirement.verification]
method = "Test"
level = "System"
phase = "Release"
owner = "Project Lead"
success_criteria = "A three-level hierarchy (SYS → CLI → CORE) loaded from the rqtk self-hosted fixture has all parent–child edges intact and accessible via the graph API, with edge count equal to the total number of parent references across all requirements."

[[requirement.verification.activities]]
id = "VA-SYS-003-01"
name = "Graph round-trip test"
procedure = "Load the rqtk self-hosted requirement set; assert that each requirement with a non-empty parents list has a corresponding directed edge in the graph returned by the repository API."
expected_result = "Edge count equals the total number of parent references across all loaded requirements; no edges are missing or duplicated."
status = "Planned"

[[requirement.history]]
version = "0.1.0"
date = "2026-05-06"
author = "Wouter Doppenberg"
change = "Initial draft."

[[requirement.history]]
version = "0.1.1"
date = "2026-05-07"
author = "Wouter Doppenberg"
change = "Split compound 'shall…and shall' statement; graph maintenance retained here. Detection and reporting of graph defects (cycles, orphans, broken references) split to RQTK-SYS-0007."

[requirement.tags]
