[requirement]
id = "RQTK-SYS-0004"
title = "Policy-Driven Validation"
category = "SYS"
type = "Functional"
version = "0.1.0"
created = "2026-05-06T00:00:00+00:00"
updated = "2026-05-06T00:00:00+00:00"

[requirement.statement]
text = "rqtk shall enforce a configurable set of lint rules against all loaded requirements and shall report each violation with a stable rule code, severity, affected requirement ID, and source file path."
rationale = "Stable rule codes enable CI gates, suppression lists, and audit trails; structured output allows downstream tooling to parse and filter results without string matching."

[requirement.status]
state = "Approved"
priority = "Critical"
criticality = "Mission-Critical"

[requirement.traceability]

[requirement.verification]
method = "Test"
level = "System"
phase = "Release"
owner = "Project Lead"
success_criteria = "Each of the 18 lint rules (RQ001–RQ018) is triggered by at least one fixture; output for each violation includes code, severity, requirement ID, and file path; exit code is 0 for a clean set and 2 when any Error-severity issue is present."

[[requirement.verification.activities]]
id = "VA-SYS-004-01"
name = "Lint rule coverage matrix"
procedure = "For each lint rule RQ001–RQ018, construct a minimal fixture that triggers it; run rqtk lint and verify the expected code appears in output."
expected_result = "All 18 codes reachable; no false positives on the clean firesat-obc fixture."
status = "Planned"

