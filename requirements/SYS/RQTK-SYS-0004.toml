[requirement]
id = "RQTK-SYS-0004"
title = "Policy-Driven Validation"
category = "SYS"
type = "Functional"
version = "0.1.1"
created = "2026-05-06T00:00:00+00:00"
updated = "2026-05-07T00:00:00+00:00"

[requirement.statement]
text = "rqtk shall evaluate all loaded requirements against the lint rules defined in the project configuration."
rationale = "Config-driven evaluation is the core value proposition; it decouples domain vocabulary (allowed states, categories, types) from the tool and lets any project enforce its own policy without modifying rqtk."

[requirement.status]
state = "Approved"
priority = "Critical"
criticality = "Mission-Critical"

[requirement.traceability]

[requirement.verification]
method = "Test"
level = "System"
phase = "Release"
owner = "Project Lead"
success_criteria = "Each of the 18 lint rules (RQ001–RQ018) is triggered by at least one fixture and produces output; no false positives appear on the clean firesat-obc fixture."

[[requirement.verification.activities]]
id = "VA-SYS-004-01"
name = "Lint rule coverage matrix"
procedure = "For each lint rule RQ001–RQ018, construct a minimal fixture that triggers it; run rqtk lint and verify the expected rule code appears in the output."
expected_result = "All 18 codes reachable; no false positives on the clean firesat-obc fixture."
status = "Planned"

