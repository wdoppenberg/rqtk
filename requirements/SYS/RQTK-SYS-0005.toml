[requirement]
id = "RQTK-SYS-0005"
title = "Multi-Format Export"
category = "SYS"
type = "Functional"
version = "0.1.0"
created = "2026-05-06T00:00:00+00:00"
updated = "2026-05-06T00:00:00+00:00"

[requirement.statement]
text = "rqtk shall export the full requirement set in JSON, CSV, and Markdown formats, writing output either to stdout or to a caller-specified file path."
rationale = "Downstream tools (spreadsheets, document generators, CI dashboards) consume different formats; supporting all three removes the need for bespoke conversion scripts and keeps rqtk as the single source of truth."

[requirement.status]
state = "Approved"
priority = "High"
criticality = "Non-Critical"

[requirement.traceability]

[requirement.verification]
method = "Test"
level = "System"
phase = "Release"
owner = "Project Lead"
success_criteria = "JSON output parses as valid JSON with one object per requirement; CSV output has a header row and one data row per requirement with no unescaped commas in values; Markdown output contains one H2 section per requirement."

[[requirement.verification.activities]]
id = "VA-SYS-005-01"
name = "Export format validation"
procedure = "Run rqtk export --format json/csv/markdown against the firesat-obc fixture and validate each output with a format-specific parser/assertion."
expected_result = "All three formats valid and contain the correct number of requirement entries."
status = "Planned"

