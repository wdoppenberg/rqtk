[requirement]
id = "RQTK-SYS-0005"
title = "Multi-Format Export"
category = "SYS"
type = "Functional"
content_hash = "20c0561f8dddaf28d8221149eeebd1498628df28a696f37b3a8f388c10282662"
parameters = []

[requirement.statement]
text = "rqtk shall export the validated requirement set in JSON, CSV, and Markdown formats, writing output either to stdout or to a user-specified file path."
rationale = "Downstream tools (spreadsheets, document generators, CI dashboards) consume different formats; supporting all three removes the need for bespoke conversion scripts and keeps rqtk as the single source of truth. Exporting only the validated set prevents policy-violating data from propagating into downstream artefacts."
assumptions = []

