[requirement]
id = "RQTK-SYS-0006"
title = "VCS Merge Compatibility"
category = "SYS"
type = "Design"
content_hash = "7eabd787d021fbaec299f1c84f3ffeeafbbb419e02a79878fdf176af20fe0921"
parameters = []

[requirement.statement]
text = "Each rqtk requirement file shall contain only plain-text UTF-8 content such that a merge conflict between concurrent edits to different fields of the same file is resolvable by standard three-way VCS merge tooling without rqtk."
rationale = "Plain-text, field-per-line TOML means git's three-way merge can resolve most concurrent edits automatically; binary or encoded content would make every conflict a manual, tool-assisted exercise."
assumptions = [
    "The VCS in use supports three-way merge (e.g., git).",
    "Each logical field occupies its own line or lines in the TOML file.",
]

