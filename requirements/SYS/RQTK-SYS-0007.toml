[requirement]
id = "RQTK-SYS-0007"
title = "Traceability Graph Defect Detection"
category = "SYS"
type = "Functional"
version = "0.1.0"
created = "2026-05-07T00:00:00+00:00"
updated = "2026-05-07T00:00:00+00:00"

[requirement.statement]
text = "rqtk shall detect and report, at validation time, all cycles, parentless non-root requirements (orphans), and broken parent references within the traceability graph."
rationale = "Undetected cycles or dangling parent links silently invalidate traceability matrices; automated defect detection prevents those errors from reaching reviews or audits."

[requirement.status]
state = "Approved"
priority = "Critical"
criticality = "Mission-Critical"

[requirement.traceability]

[requirement.verification]
method = "Test"
level = "System"
phase = "Release"
owner = "Project Lead"
success_criteria = "rqtk lint exits with code 2 and reports RQ017 when a cycle is introduced; exits with code 2 and reports RQ015 when a parent reference points to a non-existent ID; exits with code 2 and reports the orphan ID when a non-root requirement has no parent; exits with code 0 for a clean, fully-connected set."

[[requirement.verification.activities]]
id = "VA-SYS-007-01"
name = "Cycle detection test"
procedure = "Introduce a circular parent chain (A→B→A) in a fixture set and run rqtk lint; assert exit code 2 and RQ017 issue present."
expected_result = "Exit code 2; output contains RQ017."
status = "Planned"

[[requirement.verification.activities]]
id = "VA-SYS-007-02"
name = "Broken reference test"
procedure = "Add a parent reference to a non-existent ID and run rqtk lint; assert exit code 2 and RQ015 issue present."
expected_result = "Exit code 2; output contains RQ015."
status = "Planned"

[[requirement.verification.activities]]
id = "VA-SYS-007-03"
name = "Orphan detection test"
procedure = "Add a non-root requirement with an empty parents list to a fixture where orphans are forbidden; run rqtk lint; assert exit code 2 and the orphan requirement ID in output."
expected_result = "Exit code 2; orphan requirement ID present in output."
status = "Planned"

[[requirement.history]]
version = "0.1.0"
date = "2026-05-07"
author = "Wouter Doppenberg"
change = "Split from RQTK-SYS-0003 to separate graph maintenance (SYS-0003) from defect detection and reporting. Added explicit definition of 'orphan'."

[requirement.tags]
keywords = ["traceability", "cycle-detection", "orphan", "broken-reference", "lint"]
labels = ["bootstrap"]
