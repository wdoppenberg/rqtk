[requirement.verification]
method = "Test"
level = "System"
phase = "Release"
owner = "Project Lead"
success_criteria = "rqtk lint exits with code 2 and reports RQ017 when a cycle is introduced; exits with code 2 and reports RQ015 when a parent reference points to a non-existent ID; exits with code 2 and reports the orphan ID when a non-root requirement has no parent; exits with code 0 for a clean, fully-connected set."

[[requirement.verification.activities]]
id = "VA-SYS-007-01"
name = "Cycle detection test"
procedure = "Introduce a circular parent chain (A→B→A) in a fixture set and run rqtk lint; assert exit code 2 and RQ017 issue present."
expected_result = "Exit code 2; output contains RQ017."
status = "Planned"
evidence = []

[[requirement.verification.activities]]
id = "VA-SYS-007-02"
name = "Broken reference test"
procedure = "Add a parent reference to a non-existent ID and run rqtk lint; assert exit code 2 and RQ015 issue present."
expected_result = "Exit code 2; output contains RQ015."
status = "Planned"
evidence = []

[[requirement.verification.activities]]
id = "VA-SYS-007-03"
name = "Orphan detection test"
procedure = "Add a non-root requirement with an empty parents list to a fixture where orphans are forbidden; run rqtk lint; assert exit code 2 and the orphan requirement ID in output."
expected_result = "Exit code 2; orphan requirement ID present in output."
status = "Planned"
evidence = []

