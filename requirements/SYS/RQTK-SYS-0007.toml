[requirement]
id = "RQTK-SYS-0007"
title = "Traceability Graph Defect Detection"
category = "SYS"
type = "Functional"
content_hash = "1f8ccfa4657358565d979252e8b5409d7adbba1aad95d5bca94fb67a47d18384"
parameters = []

[requirement.statement]
text = "rqtk shall detect and report, at validation time, all cycles, parentless non-root requirements (orphans), and broken parent references within the traceability graph."
rationale = "Undetected cycles or dangling parent links silently invalidate traceability matrices; automated defect detection prevents those errors from reaching reviews or audits."
assumptions = []

