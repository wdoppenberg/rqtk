success_criteria = "For each triggered lint rule, the output record contains a non-empty rule code matching the pattern RQnnn, one of the defined severity levels, the ID of the offending requirement, and an absolute or relative path to the source TOML file."

[[requirement.verification.activities]]
id = "VA-SYS-008-01"
name = "Violation record structure test"
