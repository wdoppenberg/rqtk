[requirement]
id = "RQTK-SYS-0008"
title = "Structured Violation Reporting"
category = "SYS"
type = "Functional"
content_hash = "3f01b706bc4f7430db6daf0beb895a0e6d4c1698c32d6edc28d66f544e3c7cce"
parameters = []

keywords = [
    "lint",
    "violation",
    "reporting",
    "rule-code",
    "ci",
    "bootstrap",
]

[requirement.statement]
text = "rqtk shall report each lint violation as a record containing a stable rule code, a severity level, the affected requirement ID, and the source file path."
rationale = "Stable rule codes enable CI gates, suppression lists, and audit trails; structured output allows downstream tooling to parse and filter violations without fragile string matching."
assumptions = []

